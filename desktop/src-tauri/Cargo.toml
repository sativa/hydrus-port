[package]
name = "hydrus-port-desktop"
version = "0.1.0"
description = "Tauri GUI for the HYDRUS Python port"
authors = ["zhangfeng"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "hydrus_port_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.3", features = [] }

[dependencies]
tauri = { version = "2.1.1", features = [] }
tauri-plugin-dialog = "2.0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["process", "io-util", "macros", "rt-multi-thread", "sync"] }
parking_lot = "0.12"
uuid = { version = "1.10", features = ["v4"] }
walkdir = "2.5"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
